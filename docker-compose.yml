services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=bhadresh-savani/bert-base-go-emotion
    volumes:
      - hf-cache:/app/.cache/huggingface

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  hf-cache:
